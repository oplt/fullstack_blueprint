[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fullstack-blueprint"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "starlette>=1.1.0",
    "uvicorn[standard]",
    "celery",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "redis",
    "pydantic-settings",
    "pyjwt",
    "passlib[argon2]",
    "python-multipart",
    "email-validator",
    "httpx",
    "aiosmtplib",
    "pyotp",
    "sentry-sdk",
    "prometheus-client",
    "prometheus-fastapi-instrumentator",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-instrumentation-sqlalchemy",
    "opentelemetry-exporter-otlp-proto-http",
    "opentelemetry-exporter-otlp-proto-grpc",
    "pgvector",
    "cryptography>=43.0.0",
    "tzdata>=2026.6",
]

[project.optional-dependencies]
rag-security = ["clamd"]
memory = ["mem0ai"]
storage = ["boto3"]
rag = ["boto3", "langchain-community", "langchain-text-splitters", "pypdf", "python-docx"]
rag-eval = ["simplemma"]
ai = ["pydantic-ai-slim[openai,anthropic]>=1.0"]
agentic = [
    "mcp>=1.30.0,<2",
    "jsonschema>=4.26,<5",
]
durable = ["temporalio>=1.7"]
# pip install -e ".[dev]" (CI / local). Keep in sync with [dependency-groups].dev.
dev = [
    "honcho>=2.0.0",
    "import-linter>=2.3.0",
    "openapi-spec-validator>=0.7.2",
    "pip-audit>=2.9.0",
    "pre-commit>=4.0.0",
    "pyright>=1.1.390",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.11.2",
    "langchain-community",
    "langchain-text-splitters",
    "pypdf",
    "python-docx",
    "vulture>=2.16",
]
pdf = ["pymupdf>=1.24", "pypdf"]
pdf-ocr = ["pymupdf>=1.24", "pypdf", "pillow>=10", "pytesseract>=0.3.13"]

# Editable install lives in backend/, but import root is the repo package `backend.*`
# (not sibling top-level api/core/db/...). Discover from parent so semantics stay clear.
[tool.setuptools.package-dir]
"" = ".."

[tool.setuptools.packages.find]
where = [".."]
include = ["backend*"]
exclude = [
    "backend.alembic*",
    "backend.tests*",
    "backend.logs*",
    "backend.scripts*",
    "backend.*.tests*",
    "backend.modules.*.tests*",
    "backend.modules.*.*.tests*",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 6
max-branches = 12
max-returns = 6
max-statements = 50

[tool.ruff.lint]
select = [
    "E", # Style
    "F", # Python errors
    "I", # Import sorting
    "UP", # Modern Python
    "B", # Potential bugs
    "SIM", # Simplification
    "C90", # Cyclomatic complexity
    "PLR", # Structural complexity
    "ARG", # Unused arguments
    "S", # Security
    "ASYNC", # Async correctness
    "RUF", # Ruff-specific rules
    "PERF", # Performance
    "T20", # Print statements
]
extend-select = ["PL","B", "RET"]
ignore = ["B008"]  # FastAPI Depends() in defaults
# Turkish dotless i is intentional in multilingual RAG.
allowed-confusables = ["ı"]

[tool.ruff.lint.per-file-ignores]
# Applied migration files are immutable history; their generated upgrade functions
# retain their original shape and line lengths.
"alembic/versions/*.py" = ["E501", "PLR0915"]
"alembic/env.py" = ["E402"]
# Assertions and numeric fixtures are intentional in test code.
"**/tests/**/*.py" = ["S101", "PLR2004"]
# These commands produce their documented stdout output as part of the CLI interface.
"scripts/check_architecture.py" = ["T201"]
"scripts/check_db.py" = ["T201"]
"scripts/validate_openapi.py" = ["T201"]
"tests/rag/chunking_experiments.py" = ["T201"]
"tests/rag/citation_entailment_experiment.py" = ["T201"]
"tests/rag/rerank_experiments.py" = ["T201"]
"tests/rag/retrieval_eval.py" = ["T201"]
"tests/rag/run_pgvector_load.py" = ["T201"]
# This benchmark uses seeded pseudo-random vectors to make runs reproducible.
"tests/rag/live_benchmark.py" = ["S311"]
# These are fake unusable hashes in one auth test fixture, not credentials.
"tests/test_rag_answer_run.py" = ["S106"]

[dependency-groups]
dev = [
    "honcho>=2.0.0",
    "import-linter>=2.3.0",
    "openapi-spec-validator>=0.7.2",
    "pip-audit>=2.9.0",
    "pre-commit>=4.0.0",
    "pyright>=1.1.390",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.11.2",
    "langchain-community",
    "langchain-text-splitters",
    "pypdf",
    "python-docx",
    "vulture>=2.16",
    "memray>=1.21.0",
    "opentelemetry-distro>=0.66b2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "deptry>=0.25.1",
    "pylint>=4.1.4",
]

[tool.uv]
package = true
default-groups = ["dev"]

[tool.pytest.ini_options]
faulthandler_timeout = 30
testpaths = ["."]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["backend"]

omit = [
    "*/alembic/*",
    "*/scripts/*",
    "*/tests/*",
    "*/test_*.py",
    "*/conftest.py",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
]

skip_covered = true
show_missing = true
fail_under = 80
precision = 2

[tool.pyright]
include = ["."]
venvPath = "."
venv = ".venv"
exclude = [
    "**/__pycache__",
    ".venv",
    "**/tests",
    "tests/rag",
    "alembic/versions",
]
extraPaths = [".."]
pythonVersion = "3.14"
typeCheckingMode = "standard"
reportMissingTypeStubs = "none"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
reportUnknownParameterType = "none"
reportMissingImports = "error"
reportOptionalMemberAccess = "error"
reportOptionalSubscript = "error"
reportArgumentType = "error"
reportReturnType = "error"

[tool.vulture]
paths = ["."]
exclude = [
    "*/.venv/*",
    "*/__pycache__/*",
    "*/alembic/versions/*",
]
min_confidence = 60
sort_by_size = true

[tool.deptry]
known_first_party = ["backend"]
optional_dependencies_dev_groups = ["dev"]


[tool.importlinter]
root_package = "backend"
include_external_packages = false
exclude_type_checking_imports = false

[[tool.importlinter.contracts]]
name = "Business modules must not depend on API composition"
type = "forbidden"
source_modules = ["backend.modules"]
forbidden_modules = ["backend.api"]

[[tool.importlinter.contracts]]
name = "Core must not depend on business modules"
type = "forbidden"
source_modules = ["backend.core"]
forbidden_modules = ["backend.modules"]

[[tool.importlinter.contracts]]
name = "Production modules must not depend on test or offline evaluation code"
type = "forbidden"
source_modules = ["backend.modules"]
forbidden_modules = ["backend.tests"]

[[tool.importlinter.contracts]]
name = "AI providers must not depend on routing"
type = "forbidden"
source_modules = ["backend.modules.ai.providers"]
forbidden_modules = [
    "backend.modules.ai.routing",
    "backend.modules.ai.router",
    "backend.modules.ai.run_routes",
]

# Pylint: complementary design and architecture analysis.

[tool.pylint.main]
ignore = [
    ".venv",
    "tests",
    "alembic",
    "migrations",
    "__pycache__",
]

[tool.pylint.messages_control]
disable = ["all"]
enable = [
    "cyclic-import",
    "duplicate-code",
    "too-many-ancestors",
    "too-many-instance-attributes",
    "too-many-public-methods",
    "too-many-locals",
    "too-many-boolean-expressions",
    "too-many-nested-blocks",
    "inconsistent-return-statements",
]

[tool.pylint.design]
max-parents = 5
max-attributes = 10
max-public-methods = 20
max-locals = 15
max-bool-expr = 5

[tool.pylint.refactoring]
max-nested-blocks = 4

[tool.pylint.similarities]
min-similarity-lines = 6
ignore-comments = true
ignore-docstrings = true
ignore-imports = true
ignore-signatures = true

[tool.pylint.reports]
reports = false
score = false
