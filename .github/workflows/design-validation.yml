name: Design system browser validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: design-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  design:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run design:check
      - run: node scripts/test-design-checker.mjs
      - run: npm run storybook:build
      - run: npx playwright install --with-deps chromium
      - name: Responsive, keyboard, visual and axe checks
        run: |
          if [ -d e2e-design/design.pw.ts-snapshots ]; then
            export VISUAL_COMPARE=1
          fi
          npx playwright test --config playwright.design.config.ts
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: design-browser-evidence
          if-no-files-found: ignore
          path: |
            frontend/test-results/design
            frontend/playwright-report
