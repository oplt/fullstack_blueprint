<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fullstack Blueprint</title>
    <script>
      (() => {
        try {
          const saved = JSON.parse(localStorage.getItem("fullstack-blueprint.theme") || "null");
          const mode = saved?.colorMode === "dark" || saved?.colorMode === "light"
            ? saved.colorMode
            : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          document.documentElement.dataset.theme = mode;
        } catch { /* use CSS defaults when storage is unavailable */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
